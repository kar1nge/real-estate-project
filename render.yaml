services:
  - type: web
    name: real-estate-staging
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    disk:
      name: uploaded-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-staging-db
          property: connectionString
      - key: DJANGO_MEDIA_STORAGE
        value: render_disk
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

databases:
  - name: real-estate-staging-db
    databaseName: real_estate
    user: real_estate
    plan: basic-256mb
    region: singapore
